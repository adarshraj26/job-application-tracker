services:
  - type: web
    name: jobtracker-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      - key: CORS_ORIGIN
        value: https://jobtracker-frontend.vercel.app,https://jobtracker-frontend-git-main-adarshraj26.vercel.app,https://job-application-tracker.vercel.app,https://job-application-tracker-git-main-adarshraj26.vercel.app,http://localhost:5173,http://localhost:3000
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: PORT
        value: 5000
      # Optional: Email Service (uncomment and set values if needed)
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: 587
      # - key: SMTP_USER
      #   value: your-email@gmail.com
      # - key: SMTP_PASS
      #   value: your-app-password
      # Optional: Cloud Storage (uncomment and set values if needed)
      # - key: CLOUD_NAME
      #   value: your-cloudinary-name
      # - key: CLOUD_API_KEY
      #   value: your-cloudinary-api-key
      # - key: CLOUD_API_SECRET
      #   value: your-cloudinary-api-secret 